# Замените stepy.example.ru на свой домен. Сертификат — certbot (Let's Encrypt).
server {
    listen 80;
    server_name stepy.example.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name stepy.example.ru;
    ssl_certificate     /etc/letsencrypt/live/stepy.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stepy.example.ru/privkey.pem;
    client_max_body_size 55m;

    location /static/ { alias /app/staticfiles/; expires 30d; }
    location /media/  {
        alias /app/media/;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options nosniff;
    }
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

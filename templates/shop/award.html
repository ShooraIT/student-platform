{% extends 'base.html' %}{% block title %}Выдать награду{% endblock %}{% block content %}{% include '_page_head.html' with eyebrow='МАГАЗИН 01:17' title='Выдать награду' lead='Эти товары нельзя купить за степы: они выдаются колледжем за достижение или вклад.' %}<form class="card" method="post">{% csrf_token %}<label>Студент<select name="user" required><option value="">Выбрать студента</option>{% for s in students %}<option value="{{ s.pk }}">{{ s.full_name }}{% if s.group %} · {{ s.group }}{% endif %}</option>{% endfor %}</select></label><label>Награда<select name="variant" required><option value="">Выбрать товар</option>{% for v in variants %}<option value="{{ v.pk }}">{{ v }} · остаток {{ v.stock }}</option>{% endfor %}</select></label><label>Основание<input name="reason" maxlength="255" value="Награда колледжа"></label><button class="btn primary">Выдать</button></form>{% endblock %}

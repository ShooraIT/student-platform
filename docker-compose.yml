services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on: [db]
    volumes: [media:/app/media, static:/app/staticfiles]

  # Периодические задачи: розыгрыши, напоминания, отмена невыданных заказов
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on: [db]
    command: sh -c "while true; do python manage.py run_scheduled; sleep 300; done"

  # Отправка пуш-уведомлений из очереди (каждые 10 секунд)
  pusher:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on: [db]
    command: python manage.py send_pushes --loop

  nginx:
    image: nginx:1.27
    restart: unless-stopped
    depends_on: [web]
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/app/staticfiles:ro
      - media:/app/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  pgdata:
  media:
  static:
